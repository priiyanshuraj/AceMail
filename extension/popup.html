<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; background: #faf6f0; color: #2a2522; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 11px; color: #7a6f68; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ddd2c8; border-radius: 6px; background: #fff; }
  button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #d9572b; color: #fff; font-weight: 600; cursor: pointer; }
  button.off { background: #4a423d; }
  #status { margin-top: 10px; font-size: 12px; color: #4a423d; white-space: pre-wrap; }
  .warn { margin-top: 10px; font-size: 11px; color: #9a5a3a; }
</style>
</head>
<body>
  <h1>AceMail LinkedIn Runner</h1>
  <label for="url">AceMail address</label>
  <input id="url" placeholder="https://acemail.online" />
  <label for="key">Runner key</label>
  <input id="key" placeholder="acr_..." type="password" />
  <button id="toggle">Start</button>
  <div id="status"></div>
  <p class="warn">Stay signed in to LinkedIn in this browser. Steps run in a background tab with human-like pauses. Keep daily limits low.</p>
  <script src="popup.js"></script>
</body>
</html>
